name: Build Prison Realm

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Locate Gradle project
        run: |
          BUILD_FILE=$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "No Gradle build file found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Build
        run: gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PrisonRealm
          path: '**/build/libs/*.jar'
